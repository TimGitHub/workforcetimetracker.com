# Pings the IndexNow API on every push to main with the URLs that actually
# changed. Bing / DuckDuckGo / Yandex pick this up and re-crawl the changed
# pages within hours instead of days. Free, no signup, public protocol.
#
# How it works:
#   1. The repo serves a key file at /c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2.txt
#      whose contents must equal the key. IndexNow fetches this once to verify
#      we own the host.
#   2. We POST a JSON body listing the changed URLs to api.indexnow.org.
#   3. The receiving search engines fan it out internally.

name: IndexNow ping

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (with previous commit so we can diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed HTML files
        id: changed
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD~1 HEAD -- '*.html' | sort -u)
          if [ -z "$changed" ]; then
            echo "list=" >> "$GITHUB_OUTPUT"
            echo "No HTML files changed; skipping IndexNow ping."
            exit 0
          fi
          # Build https URLs (drop leading repo root). GitHub Pages serves the
          # repo root at https://workforcetimetracker.com/.
          urls=()
          while IFS= read -r f; do
            urls+=("https://workforcetimetracker.com/$f")
          done <<< "$changed"
          # Comma-join for the next step
          printf 'list=%s\n' "$(IFS=, ; echo "${urls[*]}")" >> "$GITHUB_OUTPUT"

      - name: Build IndexNow JSON payload
        if: steps.changed.outputs.list != ''
        id: payload
        run: |
          IFS=',' read -ra urls <<< "${{ steps.changed.outputs.list }}"
          json=$(jq -n \
            --arg host    'workforcetimetracker.com' \
            --arg key     'c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2' \
            --arg keyloc  'https://workforcetimetracker.com/c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2.txt' \
            --argjson urls "$(printf '%s\n' "${urls[@]}" | jq -R . | jq -s .)" \
            '{host:$host, key:$key, keyLocation:$keyloc, urlList:$urls}')
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$json" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "$json" | jq .

      - name: POST to IndexNow
        if: steps.changed.outputs.list != ''
        run: |
          set -euo pipefail
          response=$(curl -sS -o /tmp/indexnow.body -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/IndexNow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '${{ steps.payload.outputs.json }}')
          echo "HTTP $response"
          cat /tmp/indexnow.body || true
          if [ "$response" != "200" ] && [ "$response" != "202" ]; then
            echo "::warning::IndexNow returned $response - check that the key file at https://workforcetimetracker.com/c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2.txt is accessible."
            exit 0
          fi
