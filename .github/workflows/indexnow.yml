# Pings the IndexNow API on every push to main with the URLs that actually
# changed. Bing / DuckDuckGo / Yandex pick this up and re-crawl the changed
# pages within hours instead of days. Free, no signup, public protocol.
#
# How it works:
#   1. The repo serves a key file at /c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2.txt
#      whose contents must equal the key. IndexNow fetches this once to verify
#      we own the host.
#   2. We POST a JSON body listing the changed URLs to api.indexnow.org.
#   3. The receiving search engines fan it out internally.
#
# Filenames are untrusted data: read git's NUL-delimited output in Node and send
# a JSON file to curl. Never interpolate filenames or payloads into shell source.
# Offline regression checks: node --test .github/scripts/indexnow.test.cjs

name: IndexNow ping

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - '.github/scripts/indexnow*.cjs'
      - '.github/workflows/indexnow.yml'

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (with previous commit so we can diff)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Test IndexNow payload handling
        run: node --test .github/scripts/indexnow.test.cjs .github/scripts/site.test.cjs

      - name: POST to IndexNow
        run: |
          set -euo pipefail
          node .github/scripts/indexnow.cjs > "$RUNNER_TEMP/indexnow-payload.json"
          if [ ! -s "$RUNNER_TEMP/indexnow-payload.json" ]; then
            echo "No added or modified indexable HTML files; skipping IndexNow ping."
            exit 0
          fi
          response=$(curl -sS -o "$RUNNER_TEMP/indexnow-response.body" -w '%{http_code}' \
            --connect-timeout 10 --max-time 60 --proto '=https' \
            -X POST 'https://api.indexnow.org/IndexNow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @"$RUNNER_TEMP/indexnow-payload.json")
          echo "HTTP $response"
          cat "$RUNNER_TEMP/indexnow-response.body"
          if [ "$response" != "200" ] && [ "$response" != "202" ]; then
            echo "::error::IndexNow returned $response - check that the public key file is accessible."
            exit 1
          fi
